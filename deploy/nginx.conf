# Adhigrahan Radar web - static SPA only.
#
# nginx serves files and nothing else: the SPA reaches the API cross-origin at the URL baked into
# the bundle at build time (VITE_API_URL -> frontend/src/api/client.ts BASE_URL), through the same
# Traefik that serves this host. There is deliberately no `proxy_pass` here - adding one would make
# the browser's API origin depend on this container, on a path the app does not use.
#
# Port 3000, not 80: this tenant's Service/Ingress pair is `adhigrahan-radar-web:3000` and the cutover
# keeps object names, ports and hostnames unchanged (deploy/README.md), so the image meets the
# existing contract rather than forcing a change to it.
server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite writes content-hashed filenames into assets/ (index-<hash>.js, index-<hash>.css), so a
    # given URL's bytes never change and can be cached for as long as the URL lives. `=404` rather
    # than the SPA fallback: a missing asset must fail as a missing asset, not be answered with
    # index.html, which is exactly the bug that makes a broken deploy look like a blank page.
    location /assets/ {
        try_files $uri =404;
        # `expires` would emit a second, weaker Cache-Control of its own; one explicit header.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is the one file whose URL is stable while its contents change (it is what names the
    # hashed assets), so it must not be cached at all - otherwise a redeploy keeps serving the old
    # asset URLs from a browser cache.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # History fallback for react-router's BrowserRouter (frontend/src/App.tsx): /projects/<id> and
    # every other in-app route exists only in the client, so any path that is not a real file is
    # answered with index.html and routed by the SPA.
    location / {
        try_files $uri /index.html;
    }

    # The bundle is ~1 MB of JS+CSS before gzip; the fonts are fetched from Google by the browser
    # (frontend/index.html), not by this container.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
