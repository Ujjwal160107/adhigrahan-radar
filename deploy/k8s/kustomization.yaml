apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace, static PersistentVolume and ArgoCD Application are CLUSTER-owned (the cluster repo's
# `k8s/apps/meghmitra/` keeps them; the Application's source.path points here). Everything listed
# below is tenant-owned. `namespace:` is set for the same reason the cluster repo's per-app
# kustomizations set it: one place names the namespace, so a namespace rename never means editing
# seven files - and the kustomize namespace transformer fills it into any object that omits it.
namespace: meghmitra

resources:
  - deployment-api.yaml
  - deployment-web.yaml
  - service-api.yaml
  - service-web.yaml
  - pvc.yaml
  - ingress.yaml
  - networkpolicy.yaml

images:
  # `edge` is the moving tag the image workflow publishes from main (never `latest`). The
  # Application's argocd-image-updater image-list tracks these repositories by digest, on top of
  # what is written here - these entries exist first so that the repository name is declared
  # somewhere kustomize understands, which is what the updater's kustomize override requires.
  - name: ghcr.io/ujjwal160107/adhigrahan-radar/api
    newTag: edge
  - name: ghcr.io/ujjwal160107/adhigrahan-radar/web
    newTag: edge
