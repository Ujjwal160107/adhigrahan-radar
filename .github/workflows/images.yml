name: images

# Publishes the two container images this repository's deploy/ manifest set runs:
#   ghcr.io/<owner>/adhigrahan-radar/api:edge
#   ghcr.io/<owner>/adhigrahan-radar/web:edge
#
# `main` only, plus manual dispatch: `edge` is a moving tag by definition, and the cluster's
# argocd-image-updater resolves it to a digest in-cluster, so nothing else needs a tag written per
# commit. The shorten-sha tag that goes up beside `edge` is what makes a rollback possible without
# guessing which build is running.
#
# This is NOT ci.yml: that workflow lints and tests and must stay the gate on every push and pull
# request. This one only produces artifacts, and it produces them from the same commands - the api
# image runs `python pipeline/run_all.py --skip-handoff`, the web image runs `npm run build`
# (`tsc && vite build`).
#
# Pull requests build both images but never push them. Pushing is impossible from a fork's PR anyway -
# the token there is read-only, which is exactly why `push:` is gated rather than the trigger being
# removed. Building is worth the minutes: this workflow's job is to prove the Dockerfiles work, and a
# file that first runs after it merges proves nothing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One publisher per ref: a superseded run cancels rather than racing it to the same `:edge` tag.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # Both images are independent builds; running them as separate jobs keeps them off each other's
  # critical path and lets one be re-run alone from the Actions UI.
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only write this job needs. With it, the built-in token can publish to this owner's GHCR
      # namespace and needs no PAT, no deploy key and no secret in this repository.
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects an uppercase repository path, and the owner here is mixed case
      # (`Ujjwal160107`), so the image name is derived from the repository and lowercased rather
      # than written out by hand - a rename or a fork under a new owner keeps working.
      - name: Resolve image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          # Never push from a pull request: a fork's token is read-only, and a PR's job is to
          # validate the build, not to publish an artifact.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:edge
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          # Layer cache lives in the registry's Actions cache, not in a runner's filesystem that
          # disappears after the job. The dependency layer and the pipeline step are the expensive
          # parts of this image.
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          # No provenance attestation: it makes the published reference an OCI index whose extra
          # manifest describes nothing runnable, which is only noise for a kubelet pull and for the
          # digest the cluster pins. One manifest, one platform.
          provenance: false

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          # Never push from a pull request, same reason as the api job above.
          push: ${{ github.event_name != 'pull_request' }}
          # Vite inlines this at build time (frontend/src/api/client.ts reads import.meta.env.
          # VITE_API_URL), so the published image is bound to this API origin. Building for a
          # different hostname means passing a different value here - it cannot be changed on the
          # running container.
          build-args: |
            VITE_API_URL=https://api-meghmitra.upayan.dev
          tags: |
            ${{ steps.image.outputs.name }}:edge
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: false
